name: email-triage-env
version: "1.0.0"
description: "AI email triage: classify, reply, route, and flag emails"
tags: [openenv, email, nlp, triage, real-world]
tasks:
  - id: classify_basic
    difficulty: easy
    max_steps: 10
  - id: triage_and_reply
    difficulty: medium
    max_steps: 15
  - id: full_triage_pipeline
    difficulty: hard
    max_steps: 25
action_space: EmailAction
observation_space: EmailObservation
